{"id":329,"c":"コンクリート・構造物","q":"道路《どうろ》や鉄道《てつどう》の下《した》を横切《よこぎ》って、水路《すいろ》や通路《つうろ》にする箱形《はこがた》のコンクリート構造物《こうぞうぶつ》はどれですか。","a":"ボックスカルバート","d":["U字溝《じこう》","ヒューム管《かん》","L型擁壁《がたようへき》"],"e":"ボックスカルバートは四角《しかく》い箱《はこ》の形《かたち》をしています。現場《げんば》で打《う》つものと、プレキャスト製品《せいひん》をつなぐものがあります。"},
{"id":330,"c":"コンクリート・構造物","q":"山岳《さんがく》トンネルで、掘《ほ》った直後《ちょくご》に吹付《ふきつ》けコンクリートとロックボルトで地山《じやま》を支《ささ》え、地山《じやま》自身《じしん》の強《つよ》さを生《い》かす工法《こうほう》はどれですか。","a":"NATM","d":["シールド工法《こうほう》","開削工法《かいさくこうほう》","推進工法《すいしんこうほう》"],"e":"NATMの主《おも》な流《なが》れは、掘削《くっさく》→吹付《ふきつ》けコンクリート→ロックボルト→覆工《ふっこう》コンクリートです。トンネルの変形《へんけい》を計測《けいそく》して、安全《あんぜん》を確《たし》かめながら掘《ほ》り進《すす》めます。"},
{"id":331,"c":"舗装・測量・機械","q":"アスファルト舗装《ほそう》の構成《こうせい》を、上《うえ》から順《じゅん》に並《なら》べたものはどれですか。","a":"表層《ひょうそう》→基層《きそう》→路盤《ろばん》→路床《ろしょう》","d":["路床《ろしょう》→路盤《ろばん》→基層《きそう》→表層《ひょうそう》","基層《きそう》→表層《ひょうそう》→路床《ろしょう》→路盤《ろばん》","表層《ひょうそう》→路床《ろしょう》→基層《きそう》→路盤《ろばん》"],"e":"表層《ひょうそう》と基層《きそう》はアスファルト混合物《こんごうぶつ》、路盤《ろばん》は砕石《さいせき》などで、上層路盤《じょうそうろばん》と下層路盤《かそうろばん》に分《わ》かれます。路床《ろしょう》は舗装《ほそう》を支《ささ》える土《つち》の部分《ぶぶん》です。"},
{"id":332,"c":"舗装・測量・機械","q":"舗装《ほそう》の下《した》にあって、舗装《ほそう》を支《ささ》える厚《あつ》さ約《やく》1mの土《つち》の部分《ぶぶん》を何《なん》といいますか。","a":"路床《ろしょう》","d":["路盤《ろばん》","基層《きそう》","路肩《ろかた》"],"e":"路床《ろしょう》の下《した》を路体《ろたい》といいます。路床《ろしょう》の支持力《しじりょく》が弱《よわ》いときは、セメントや石灰《せっかい》を混《ま》ぜて改良《かいりょう》します。"},
{"id":333,"c":"舗装・測量・機械","q":"路床土《ろしょうど》の支持力《しじりょく》（強《つよ》さ）を調《しら》べるための試験《しけん》はどれですか。","a":"CBR試験《しけん》","d":["スランプ試験《しけん》","空気量試験《くうきりょうしけん》","塩化物試験《えんかぶつしけん》"],"e":"CBR試験《しけん》の結果《けっか》をもとに、舗装《ほそう》の厚《あつ》さを決《き》めます。現場《げんば》では、平板載荷試験《へいばんさいかしけん》で支持力《しじりょく》を調《しら》べることもあります。"},
{"id":334,"c":"舗装・測量・機械","q":"上層路盤《じょうそうろばん》の材料《ざいりょう》として、よく使《つか》われるものはどれですか。","a":"粒度調整砕石《りゅうどちょうせいさいせき》","d":["密粒度《みつりゅうど》アスコン","タックコート","シーリング材《ざい》"],"e":"粒度調整砕石《りゅうどちょうせいさいせき》は、大小《だいしょう》の砕石《さいせき》をうまく混《ま》ぜて、よく締《し》まるようにした材料《ざいりょう》です。下層路盤《かそうろばん》にはクラッシャランなどが使《つか》われます。"},
{"id":335,"c":"舗装・測量・機械","q":"路盤材《ろばんざい》にセメントを混《ま》ぜて、強《つよ》さと耐久性《たいきゅうせい》を高《たか》める工法《こうほう》はどれですか。","a":"セメント安定処理《あんていしょり》","d":["プライムコート","タックコート","シールコート"],"e":"安定処理《あんていしょり》には、セメントのほかに石灰《せっかい》やアスファルトを使《つか》うものもあります。路盤《ろばん》が強《つよ》くなると、舗装《ほそう》が長持《ながも》ちします。"},
{"id":336,"c":"舗装・測量・機械","q":"路盤《ろばん》の上《うえ》に散布《さんぷ》して、路盤《ろばん》とアスファルト混合物《こんごうぶつ》のなじみをよくするものはどれですか。","a":"プライムコート","d":["タックコート","シールコート","はく離剤《りざい》"],"e":"プライムコートは路盤《ろばん》の表面《ひょうめん》を安定《あんてい》させ、雨水《あまみず》がしみこむのも防《ふせ》ぎます。アスファルト乳剤《にゅうざい》（PK-3）がよく使《つか》われます。"},
{"id":337,"c":"舗装・測量・機械","q":"基層《きそう》と表層《ひょうそう》のように、アスファルト混合物《こんごうぶつ》の層《そう》と層《そう》をよくくっつけるために散布《さんぷ》するものはどれですか。","a":"タックコート","d":["プライムコート","シールコート","フォグシール"],"e":"タックコートには、アスファルト乳剤《にゅうざい》（PK-4）がよく使《つか》われます。散布《さんぷ》したら、乳剤《にゅうざい》が分解《ぶんかい》してから混合物《こんごうぶつ》を敷《し》きます。"},
{"id":338,"c":"舗装・測量・機械","q":"アスファルト混合物《こんごうぶつ》を、決《き》められた厚《あつ》さと幅《はば》に敷《し》き均《なら》す機械《きかい》はどれですか。","a":"アスファルトフィニッシャ","d":["モーターグレーダ","タイヤローラ","ディストリビュータ"],"e":"アスファルトフィニッシャは、ダンプトラックから受《う》け取《と》った混合物《こんごうぶつ》を、スクリードで平《たい》らに敷《し》き均《なら》します。ディストリビュータは乳剤《にゅうざい》を散布《さんぷ》する機械《きかい》です。"},
{"id":339,"c":"舗装・測量・機械","q":"アスファルト混合物《こんごうぶつ》の締固《しめかた》め（転圧《てんあつ》）の順番《じゅんばん》として、正《ただ》しいものはどれですか。","a":"初転圧《しょてんあつ》→二次転圧《にじてんあつ》→仕上《しあ》げ転圧《てんあつ》","d":["仕上《しあ》げ転圧《てんあつ》→初転圧《しょてんあつ》→二次転圧《にじてんあつ》","二次転圧《にじてんあつ》→初転圧《しょてんあつ》→仕上《しあ》げ転圧《てんあつ》","初転圧《しょてんあつ》→仕上《しあ》げ転圧《てんあつ》→二次転圧《にじてんあつ》"],"e":"初転圧《しょてんあつ》はロードローラ（マカダムローラやタンデムローラ）、二次転圧《にじてんあつ》はタイヤローラや振動《しんどう》ローラ、仕上《しあ》げ転圧《てんあつ》はタイヤローラやロードローラで行《おこな》います。"},
{"id":340,"c":"舗装・測量・機械","q":"アスファルト混合物《こんごうぶつ》の初転圧《しょてんあつ》は、一般《いっぱん》にどのくらいの温度《おんど》で行《おこな》いますか。","a":"110〜140℃","d":["20〜30℃","50〜60℃","200〜250℃"],"e":"温度《おんど》が下《さ》がると混合物《こんごうぶつ》がかたくなり、十分《じゅうぶん》に締《し》め固《かた》められません。二次転圧《にじてんあつ》は70〜90℃くらいで終《お》わらせます。"},
{"id":341,"c":"舗装・測量・機械","q":"アスファルト舗装《ほそう》の二次転圧《にじてんあつ》によく使《つか》われる、ゴムタイヤで締《し》め固《かた》めるローラはどれですか。","a":"タイヤローラ","d":["マカダムローラ","タンパ","ブルドーザ"],"e":"タイヤローラは、タイヤの空気圧《くうきあつ》やおもりで重《おも》さを調整《ちょうせい》でき、混合物《こんごうぶつ》をこねるように締《し》め固《かた》めます。路盤《ろばん》や土《つち》の締固《しめかた》めにも使《つか》います。"},
{"id":342,"c":"舗装・測量・機械","q":"ローラでアスファルト混合物《こんごうぶつ》を転圧《てんあつ》するとき、正《ただ》しい方法《ほうほう》はどれですか。","a":"駆動輪《くどうりん》をフィニッシャ側《がわ》に向《む》けて転圧《てんあつ》する","d":["案内輪《あんないりん》をフィニッシャ側《がわ》に向《む》けて転圧《てんあつ》する","横断勾配《おうだんこうばい》の高《たか》い方《ほう》から転圧《てんあつ》する","ローラを混合物《こんごうぶつ》の上《うえ》で長《なが》く止《と》めておく"],"e":"駆動輪《くどうりん》を前《まえ》にすると、混合物《こんごうぶつ》が押《お》されてずれたり、ひび割《わ》れたりしにくくなります。転圧《てんあつ》は、横断勾配《おうだんこうばい》の低《ひく》い方《ほう》から高《たか》い方《ほう》へ進《すす》めます。"},
{"id":343,"c":"舗装・測量・機械","q":"アスファルト舗装《ほそう》の工事《こうじ》のあと、交通開放《こうつうかいほう》してよいのは、舗装《ほそう》の表面温度《ひょうめんおんど》がおおむね何《なん》℃以下《いか》になってからですか。","a":"50℃以下《いか》","d":["80℃以下《いか》","100℃以下《いか》","120℃以下《いか》"],"e":"熱《あつ》いうちに車《くるま》を通《とお》すと、わだち掘《ぼ》れなどの変形《へんけい》が起《お》きやすくなります。急《いそ》ぐときは、散水《さんすい》などで舗装《ほそう》を冷《ひ》やします。"},
{"id":344,"c":"舗装・測量・機械","q":"車《くるま》のタイヤが通《とお》る所《ところ》が、帯《おび》のようにへこむ舗装《ほそう》の傷《いた》み方《かた》はどれですか。","a":"わだち掘《ぼ》れ","d":["亀甲状《きっこうじょう》ひび割《わ》れ","ポットホール","段差《だんさ》"],"e":"わだち掘《ぼ》れは、大型車《おおがたしゃ》が多《おお》い道路《どうろ》や、夏《なつ》の暑《あつ》い時期《じき》に起《お》こりやすいです。流動《りゅうどう》しにくい混合物《こんごうぶつ》を使《つか》うなどの対策《たいさく》があります。"},
{"id":345,"c":"舗装・測量・機械","q":"舗装《ほそう》の表面《ひょうめん》に、亀《かめ》の甲羅《こうら》のような細《こま》かいひび割《わ》れが広《ひろ》がっていました。主《おも》な原因《げんいん》として考《かんが》えられるものはどれですか。","a":"路盤《ろばん》や路床《ろしょう》の支持力不足《しじりょくぶそく》","d":["タックコートの量《りょう》が多《おお》すぎた","アスファルトの色《いろ》が黒《くろ》すぎた","目地《めじ》の数《かず》が多《おお》すぎた"],"e":"亀甲状《きっこうじょう》ひび割《わ》れは、舗装《ほそう》の下《した》の支《ささ》える力《ちから》が足《た》りなかったり、くり返《かえ》しの荷重《かじゅう》で舗装《ほそう》が疲《つか》れたりして起《お》こります。ひどいときは路盤《ろばん》からやり直《なお》します。"},
{"id":346,"c":"舗装・測量・機械","q":"すき間《ま》の多《おお》い混合物《こんごうぶつ》を使《つか》い、雨水《あまみず》を舗装《ほそう》の中《なか》に通《とお》して流《なが》す舗装《ほそう》はどれですか。","a":"排水性舗装《はいすいせいほそう》","d":["コンクリート舗装《ほそう》","密粒度《みつりゅうど》アスファルト舗装《ほそう》","半《はん》たわみ性舗装《せいほそう》"],"e":"排水性舗装《はいすいせいほそう》は、雨《あめ》の日《ひ》の水《みず》はねやスリップを減《へ》らし、車《くるま》の走行音《そうこうおん》も小《ちい》さくなります。下《した》の層《そう》は水《みず》を通《とお》さないようにして、水《みず》を横《よこ》に流《なが》します。"},
{"id":347,"c":"舗装・測量・機械","q":"コンクリート舗装《ほそう》に目地《めじ》を設《もう》ける主《おも》な目的《もくてき》はどれですか。","a":"温度変化《おんどへんか》によるひび割《わ》れを防《ふせ》ぐ","d":["雨水《あまみず》を舗装《ほそう》の下《した》に流《なが》す","車《くるま》がすべらないようにする","コンクリートを早《はや》く固《かた》める"],"e":"コンクリートは温度《おんど》で伸《の》び縮《ちぢ》みします。目地《めじ》（収縮目地《しゅうしゅくめじ》・膨張目地《ぼうちょうめじ》）を作《つく》って、ひび割《わ》れが勝手《かって》に入《はい》らないようにします。目地《めじ》には注入目地材《ちゅうにゅうめじざい》をつめて、水《みず》が入《はい》らないようにします。"},
{"id":348,"c":"舗装・測量・機械","q":"水準測量《すいじゅんそくりょう》で、A点《てん》の後視《こうし》が1.5m、B点《てん》の前視《ぜんし》が1.2mでした。B点《てん》はA点《てん》と比《くら》べてどうですか。","a":"0.3m高《たか》い","d":["0.3m低《ひく》い","2.7m高《たか》い","1.2m低《ひく》い"],"e":"高低差《こうていさ》＝後視《こうし》−前視《ぜんし》＝1.5−1.2＝0.3mです。答《こた》えがプラスなので、B点《てん》のほうが高《たか》くなります。前視《ぜんし》の読《よ》みが小《ちい》さいほど、その点《てん》は高《たか》いです。"},
{"id":349,"c":"舗装・測量・機械","q":"標高《ひょうこう》10.0mのBMで後視《こうし》1.5m、C点《てん》で前視《ぜんし》0.8mを読《よ》みました。C点《てん》の標高《ひょうこう》はどれですか。","a":"10.7m","d":["9.3m","11.5m","12.3m"],"e":"まず器械高《きかいだか》＝10.0＋1.5＝11.5mです。C点《てん》の標高《ひょうこう》＝器械高《きかいだか》−前視《ぜんし》＝11.5−0.8＝10.7mになります。"},
{"id":350,"c":"舗装・測量・機械","q":"水準測量《すいじゅんそくりょう》の「器械高《きかいだか》」の求《もと》め方《かた》として、正《ただ》しいものはどれですか。","a":"既知点《きちてん》の標高《ひょうこう》＋後視《こうし》","d":["既知点《きちてん》の標高《ひょうこう》−後視《こうし》","後視《こうし》＋前視《ぜんし》","前視《ぜんし》−後視《こうし》"],"e":"器械高《きかいだか》は、レベルの視準線《しじゅんせん》の高《たか》さのことです。求《もと》めたい点《てん》の標高《ひょうこう》は「器械高《きかいだか》−前視《ぜんし》」で計算《けいさん》します。"},
{"id":351,"c":"舗装・測量・機械","q":"工事現場《こうじげんば》の近《ちか》くに、高《たか》さの基準《きじゅん》として仮《かり》に設《もう》ける点《てん》を何《なん》といいますか。","a":"TBM（仮《かり》ベンチマーク）","d":["BM（水準点《すいじゅんてん》）","トラバース点《てん》","逃《に》げ杭《ぐい》"],"e":"国《くに》が設置《せっち》した水準点《すいじゅんてん》（BM）から高《たか》さを移《うつ》して、現場《げんば》の近《ちか》くにTBMを作《つく》ります。工事《こうじ》で動《うご》かない場所《ばしょ》に設《もう》け、ときどき確認《かくにん》します。"},
{"id":352,"c":"舗装・測量・機械","q":"水準測量《すいじゅんそくりょう》でレベルを据《す》える場所《ばしょ》として、正《ただ》しいものはどれですか。","a":"後視《こうし》と前視《ぜんし》の距離《きょり》がほぼ等《ひと》しい所《ところ》","d":["後視《こうし》の標尺《ひょうしゃく》のすぐ横《よこ》","前視《ぜんし》の標尺《ひょうしゃく》のすぐ横《よこ》","どちらの標尺《ひょうしゃく》からもできるだけ遠《とお》い所《ところ》"],"e":"後視《こうし》と前視《ぜんし》の距離《きょり》を等《ひと》しくすると、レベルの視準軸《しじゅんじく》の誤差《ごさ》などを消《け》すことができます。レベルは三脚《さんきゃく》をしっかり固定《こてい》して据《す》えます。"},
{"id":353,"c":"舗装・測量・機械","q":"水準測量《すいじゅんそくりょう》で標尺《ひょうしゃく》を読《よ》むときの正《ただ》しい方法《ほうほう》はどれですか。","a":"標尺《ひょうしゃく》を前後《ぜんご》にゆっくり傾《かたむ》け、最小《さいしょう》の読《よ》みを取《と》る","d":["標尺《ひょうしゃく》を前《まえ》に傾《かたむ》け、いちばん大《おお》きい読《よ》みを取《と》る","標尺《ひょうしゃく》を横《よこ》に寝《ね》かせて読《よ》む","標尺《ひょうしゃく》を斜《なな》めに立《た》てたまま読《よ》む"],"e":"標尺《ひょうしゃく》が傾《かたむ》くと読《よ》みが大《おお》きくなります。いちばん小《ちい》さい値《あたい》のとき、標尺《ひょうしゃく》が鉛直《えんちょく》に立《た》っています。"},
{"id":354,"c":"舗装・測量・機械","q":"1台《だい》で角度《かくど》と距離《きょり》を同時《どうじ》に測《はか》れる測量機器《そくりょうきき》はどれですか。","a":"トータルステーション","d":["オートレベル","標尺《ひょうしゃく》","下《さ》げ振《ふ》り"],"e":"トータルステーション（TS）は、角度《かくど》を測《はか》る機能《きのう》と距離《きょり》を測《はか》る機能《きのう》を合《あ》わせた機器《きき》です。座標《ざひょう》を計算《けいさん》して、杭《くい》の位置《いち》を出《だ》すこともできます。"},
{"id":355,"c":"舗装・測量・機械","q":"人工衛星《じんこうえいせい》からの電波《でんぱ》を受《う》けて、位置《いち》を測《はか》る測量《そくりょう》はどれですか。","a":"GNSS測量《そくりょう》","d":["水準測量《すいじゅんそくりょう》","平板測量《へいばんそくりょう》","トラバース測量《そくりょう》"],"e":"GNSSは、GPSなどの衛星《えいせい》を使《つか》うしくみをまとめた呼《よ》び方《かた》です。上空《じょうくう》が開《ひら》けた場所《ばしょ》で使《つか》い、高《たか》い建物《たてもの》や木《き》の近《ちか》くでは精度《せいど》が落《お》ちます。"},
{"id":356,"c":"舗装・測量・機械","q":"いくつかの測点《そくてん》を折《お》れ線《せん》で結《むす》び、その角度《かくど》と距離《きょり》を測《はか》って各点《かくてん》の位置《いち》を決《き》める測量《そくりょう》はどれですか。","a":"トラバース測量《そくりょう》","d":["水準測量《すいじゅんそくりょう》","GNSS測量《そくりょう》","写真測量《しゃしんそくりょう》"],"e":"トラバース測量《そくりょう》は多角測量《たかくそくりょう》ともいいます。出発点《しゅっぱつてん》に戻《もど》る閉合《へいごう》トラバースなどで行《おこな》い、誤差《ごさ》を確《たし》かめて調整《ちょうせい》します。"},
{"id":358,"c":"舗装・測量・機械","q":"ICT施工《せこう》で、建設機械《けんせつきかい》の位置《いち》と設計《せっけい》の高《たか》さの差《さ》を、運転席《うんてんせき》のモニターでオペレーターに知《し》らせる技術《ぎじゅつ》はどれですか。","a":"マシンガイダンス","d":["マシンコントロール","トラバース測量《そくりょう》","丁張《ちょうは》り"],"e":"マシンガイダンス（MG）は、3次元《じげん》の設計《せっけい》データと機械《きかい》の位置《いち》を比《くら》べて、オペレーターに表示《ひょうじ》します。マシンコントロール（MC）は、排土板《はいどばん》などを自動《じどう》で動《うご》かす技術《ぎじゅつ》です。"},
{"id":359,"c":"舗装・測量・機械","q":"ドローンで空《そら》から写真《しゃしん》をたくさん撮《と》り、地形《ちけい》の3次元《じげん》データを作《つく》る測量《そくりょう》はどれですか。","a":"UAV写真測量《しゃしんそくりょう》","d":["水準測量《すいじゅんそくりょう》","トラバース測量《そくりょう》","平板測量《へいばんそくりょう》"],"e":"UAV写真測量《しゃしんそくりょう》では、点群《てんぐん》データという、たくさんの点《てん》の集《あつ》まりで地形《ちけい》を表《あらわ》します。土量《どりょう》の計算《けいさん》や出来形《できがた》の確認《かくにん》にも使《つか》います。"},
{"id":360,"c":"舗装・測量・機械","q":"機械《きかい》が置《お》かれた地面《じめん》より低《ひく》い所《ところ》を掘《ほ》るのに適《てき》している建設機械《けんせつきかい》はどれですか。","a":"バックホウ","d":["ローディングショベル","モーターグレーダ","タイヤローラ"],"e":"バックホウはバケットを手前《てまえ》に引《ひ》いて掘《ほ》るので、溝掘《みぞほ》りや床掘《とこぼ》りに向《む》いています。ローディングショベルは、機械《きかい》より高《たか》い所《ところ》の掘削《くっさく》や積込《つみこ》みに向《む》いています。"},
{"id":361,"c":"舗装・測量・機械","q":"土《つち》を掘《ほ》りながら押《お》して、短《みじか》い距離《きょり》を運《はこ》ぶのに適《てき》している機械《きかい》はどれですか。","a":"ブルドーザ","d":["クラムシェル","タイヤローラ","アスファルトフィニッシャ"],"e":"ブルドーザは排土板《はいどばん》（ブレード）で掘削《くっさく》・押土《おしど》・敷均《しきなら》しをします。運搬距離《うんぱんきょり》はおおむね60m以下《いか》が目安《めやす》です。"},
{"id":362,"c":"舗装・測量・機械","q":"ブルドーザの後《うし》ろに付《つ》けて、かたい地盤《じばん》や軟《やわ》らかい岩《いわ》を掘《ほ》り起《お》こす、爪《つめ》のような装置《そうち》はどれですか。","a":"リッパ","d":["バケット","スクリード","アウトリガー"],"e":"リッパで岩《いわ》を砕《くだ》いてから、ブルドーザで押《お》して運《はこ》びます。これをリッパ作業《さぎょう》といいます。"},
{"id":363,"c":"舗装・測量・機械","q":"長《なが》いブレードで、路盤《ろばん》や道路《どうろ》の表面《ひょうめん》を平《たい》らに仕上《しあ》げる機械《きかい》はどれですか。","a":"モーターグレーダ","d":["バックホウ","クラムシェル","ダンプトラック"],"e":"モーターグレーダは、ブレードの角度《かくど》や高《たか》さを細《こま》かく調整《ちょうせい》できるので、路盤《ろばん》の敷均《しきなら》しや整形《せいけい》に使《つか》います。砂利道《じゃりみち》の補修《ほしゅう》や除雪《じょせつ》にも使《つか》います。"},
{"id":364,"c":"舗装・測量・機械","q":"ワイヤでつったバケットを開《ひら》いて落《お》とし、閉《と》じながら土《つち》をつかんで、深《ふか》い所《ところ》を掘《ほ》る機械《きかい》はどれですか。","a":"クラムシェル","d":["モーターグレーダ","スクレーパ","振動《しんどう》ローラ"],"e":"クラムシェルは、立坑《たてこう》や基礎《きそ》の深《ふか》い掘削《くっさく》、水中《すいちゅう》の掘削《くっさく》に向《む》いています。狭《せま》い場所《ばしょ》で垂直《すいちょく》に深《ふか》く掘《ほ》れます。"},
{"id":365,"c":"舗装・測量・機械","q":"1台《だい》で掘削《くっさく》・積込《つみこ》み・運搬《うんぱん》・敷均《しきなら》しまでできる機械《きかい》はどれですか。","a":"スクレーパ","d":["タンパ","クラムシェル","タイヤローラ"],"e":"スクレーパは、ボウルという入《い》れ物《もの》に土《つち》を削《けず》り取《と》って運《はこ》び、まき出《だ》します。広《ひろ》い造成地《ぞうせいち》など、中《ちゅう》〜長距離《ちょうきょり》の運搬《うんぱん》に向《む》いています。"},
{"id":368,"c":"舗装・測量・機械","q":"車両系建設機械《しゃりょうけいけんせつきかい》で、その日《ひ》の作業開始前《さぎょうかいしまえ》に必《かなら》ず点検《てんけん》するものはどれですか。","a":"ブレーキやクラッチの機能《きのう》","d":["エンジンの分解整備《ぶんかいせいび》","車体《しゃたい》の塗装《とそう》の色《いろ》","前回《ぜんかい》の燃料代《ねんりょうだい》"],"e":"労働安全衛生規則《ろうどうあんぜんえいせいきそく》で、その日《ひ》の作業《さぎょう》を始《はじ》める前《まえ》に、ブレーキとクラッチの機能《きのう》を点検《てんけん》することが決《き》められています。異常《いじょう》があれば、直《なお》してから使《つか》います。"},
{"id":370,"c":"舗装・測量・機械","q":"移動式《いどうしき》クレーンで作業《さぎょう》する前《まえ》に、転倒《てんとう》を防《ふせ》ぐためにすることとして、正《ただ》しいものはどれですか。","a":"アウトリガーを最大《さいだい》に張《は》り出《だ》し、敷板《しきいた》の上《うえ》に設置《せっち》する","d":["アウトリガーは使《つか》わず、タイヤだけで支《ささ》える","やわらかい地面《じめん》に、そのまま設置《せっち》する","つり荷《に》の重《おも》さは確《たし》かめずに作業《さぎょう》する"],"e":"アウトリガーを張《は》り出《だ》すと安定《あんてい》がよくなります。地盤《じばん》が弱《よわ》いときは、鉄板《てっぱん》や敷板《しきいた》を敷《し》いて沈《しず》まないようにします。定格荷重《ていかくかじゅう》をこえる荷《に》をつってはいけません。"},
{"id":401,"c":"安全管理","q":"機体重量《きたいじゅうりょう》が3t以上《いじょう》のバックホウ（車両系建設機械《しゃりょうけいけんせつきかい》）を運転《うんてん》するのに必要《ひつよう》な資格《しかく》はどれですか。","a":"技能講習《ぎのうこうしゅう》の修了《しゅうりょう》","d":["特別教育《とくべつきょういく》の修了《しゅうりょう》","職長教育《しょくちょうきょういく》の修了《しゅうりょう》","普通自動車《ふつうじどうしゃ》の運転免許《うんてんめんきょ》だけ"],"e":"機体重量《きたいじゅうりょう》3t以上《いじょう》は技能講習《ぎのうこうしゅう》、3t未満《みまん》は特別教育《とくべつきょういく》が必要《ひつよう》です。公道《こうどう》を走《はし》るときは、別《べつ》に自動車《じどうしゃ》の運転免許《うんてんめんきょ》もいります。"},
{"id":402,"c":"安全管理","q":"パワーショベル（バックホウ）の使《つか》い方《かた》で、してはいけないことはどれですか。","a":"バケットに人《ひと》を乗《の》せて高《たか》い所《ところ》へ上《あ》げる","d":["作業《さぎょう》の前《まえ》に機械《きかい》を点検《てんけん》する","誘導員《ゆうどういん》の合図《あいず》に従《したが》って動《うご》かす","運転席《うんてんせき》を離《はな》れる前《まえ》にバケットを下《お》ろす"],"e":"車両系建設機械《しゃりょうけいけんせつきかい》を、決《き》められた用途《ようと》以外《いがい》に使《つか》うこと（用途外使用《ようとがいしよう》）は原則《げんそく》禁止《きんし》です。バケットに人《ひと》を乗《の》せるのは、とても危険《きけん》です。"},
{"id":403,"c":"安全管理","q":"車両系建設機械《しゃりょうけいけんせつきかい》の運転者《うんてんしゃ》が運転席《うんてんせき》を離《はな》れるとき、正《ただ》しいものはどれですか。","a":"バケットを地面《じめん》に下《お》ろし、エンジンを止《と》める","d":["バケットを高《たか》く上《あ》げたままにする","すぐ戻《もど》るならエンジンはかけたままにする","キーを差《さ》したまま、ブレーキはかけない"],"e":"バケットなどの作業装置《さぎょうそうち》を地面《じめん》に下《お》ろし、エンジンを止《と》めてブレーキをかけます。キーも抜《ぬ》いて、ほかの人《ひと》が勝手《かって》に動《うご》かせないようにします。"},
{"id":404,"c":"安全管理","q":"バックホウが作業《さぎょう》しているとき、旋回《せんかい》する範囲《はんい》について正《ただ》しいものはどれですか。","a":"作業中《さぎょうちゅう》は人《ひと》が入《はい》らないようにする","d":["手《て》で合図《あいず》をすれば入《はい》ってよい","急《いそ》いでいるときは入《はい》ってよい","運転者《うんてんしゃ》に声《こえ》をかければ入《はい》ってよい"],"e":"バックホウの後《うし》ろや横《よこ》は運転者《うんてんしゃ》から見《み》えにくく、旋回《せんかい》したときにはさまれる事故《じこ》が多《おお》いです。カラーコーンなどで立入禁止《たちいりきんし》の区域《くいき》をはっきり示《しめ》します。"},
{"id":405,"c":"安全管理","q":"路肩《ろかた》や傾斜地《けいしゃち》で車両系建設機械《しゃりょうけいけんせつきかい》を使《つか》い、機械《きかい》が転倒《てんとう》・転落《てんらく》するおそれがあるとき、どうしますか。","a":"誘導員《ゆうどういん》を置《お》いて、機械《きかい》を誘導《ゆうどう》させる","d":["スピードを上《あ》げて早《はや》く通《とお》りすぎる","運転者《うんてんしゃ》1人《ひとり》の判断《はんだん》で進《すす》む","路肩《ろかた》ぎりぎりを走《はし》って道《みち》を広《ひろ》く使《つか》う"],"e":"転倒《てんとう》・転落《てんらく》を防《ふせ》ぐため、誘導員《ゆうどういん》を置《お》き、決《き》められた合図《あいず》で誘導《ゆうどう》します。路肩《ろかた》が崩《くず》れないようにし、通路《つうろ》の幅《はば》も十分《じゅうぶん》にとります。"},
{"id":406,"c":"安全管理","q":"車両系建設機械《しゃりょうけいけんせつきかい》を使《つか》う作業《さぎょう》の前《まえ》に作《つく》る「作業計画《さぎょうけいかく》」に書《か》く内容《ないよう》はどれですか。","a":"機械《きかい》の種類《しゅるい》・運行経路《うんこうけいろ》・作業方法《さぎょうほうほう》","d":["機械《きかい》を買《か》った日《ひ》と値段《ねだん》","運転者《うんてんしゃ》の年齢《ねんれい》と出身地《しゅっしんち》","工事《こうじ》の請負金額《うけおいきんがく》と支払日《しはらいび》"],"e":"作業計画《さぎょうけいかく》には、使《つか》う機械《きかい》の種類《しゅるい》と能力《のうりょく》、運行経路《うんこうけいろ》、作業《さぎょう》の方法《ほうほう》を書《か》きます。作業員《さぎょういん》にも内容《ないよう》を知《し》らせます。"},
{"id":407,"c":"安全管理","q":"手掘《てぼ》りで砂《すな》の地山《じやま》を掘《ほ》るとき、掘削面《くっさくめん》の勾配《こうばい》は何度《なんど》以下《いか》にしますか（または高《たか》さ5m未満《みまん》にします）。","a":"35度《ど》以下《いか》","d":["45度《ど》以下《いか》","60度《ど》以下《いか》","75度《ど》以下《いか》"],"e":"砂《すな》は崩《くず》れやすいので、勾配《こうばい》35度《ど》以下《いか》、または高《たか》さ5m未満《みまん》にします。発破《はっぱ》などで崩《くず》れやすくなった地山《じやま》は、45度《ど》以下《いか》または高《たか》さ2m未満《みまん》です。"},
{"id":408,"c":"安全管理","q":"手掘《てぼ》りで、岩盤《がんばん》や堅《かた》い粘土《ねんど》ではない「その他《た》の地山《じやま》」を、高《たか》さ2m以上《いじょう》5m未満《みまん》で掘《ほ》るとき、掘削面《くっさくめん》の勾配《こうばい》は何度《なんど》以下《いか》ですか。","a":"75度《ど》以下《いか》","d":["35度《ど》以下《いか》","60度《ど》以下《いか》","90度《ど》以下《いか》"],"e":"その他《た》の地山《じやま》は、高《たか》さ2m未満《みまん》なら90度《ど》以下《いか》、2m以上《いじょう》5m未満《みまん》なら75度《ど》以下《いか》、5m以上《いじょう》なら60度《ど》以下《いか》です。"},
{"id":409,"c":"安全管理","q":"土止《どど》め支保工《しほこう》を点検《てんけん》しなければならないのは、いつですか。","a":"7日《か》をこえない期間《きかん》ごとと、大《おお》きな地震《じしん》や大雨《おおあめ》のあと","d":["1か月《げつ》に1回《かい》、決《き》めた日《ひ》だけ","工事《こうじ》がすべて終《お》わったときだけ","作業員《さぎょういん》が「おかしい」と気《き》づいたときだけ"],"e":"土止《どど》め支保工《しほこう》は、7日《か》をこえない期間《きかん》ごと、中震《ちゅうしん》以上《いじょう》の地震《じしん》のあと、大雨《おおあめ》などで地山《じやま》が急《きゅう》に弱《よわ》くなるおそれがあったあとに点検《てんけん》します。矢板《やいた》・腹《はら》おこし・切《き》りばりのゆるみや変形《へんけい》を見《み》ます。"},
{"id":410,"c":"安全管理","q":"道路《どうろ》を掘《ほ》る前《まえ》に、地下《ちか》のガス管《かん》や電線《でんせん》などの埋設物《まいせつぶつ》を確《たし》かめる方法《ほうほう》として、正《ただ》しいものはどれですか。","a":"管理者《かんりしゃ》の図面《ずめん》で確認《かくにん》し、試掘《しくつ》して位置《いち》を確《たし》かめる","d":["機械《きかい》で一気《いっき》に深《ふか》く掘《ほ》って確《たし》かめる","図面《ずめん》だけ見《み》て、すぐ機械《きかい》で掘《ほ》る","埋設物《まいせつぶつ》はないものと考《かんが》えて掘《ほ》る"],"e":"埋設物《まいせつぶつ》を壊《こわ》すと、ガスもれや停電《ていでん》など大《おお》きな事故《じこ》になります。埋設物《まいせつぶつ》の近《ちか》くは機械《きかい》を使《つか》わず、手掘《てぼ》りで慎重《しんちょう》に掘《ほ》ります。必要《ひつよう》なときは管理者《かんりしゃ》に立会《たちあ》ってもらいます。"},
{"id":411,"c":"安全管理","q":"道路工事《どうろこうじ》で、工事区域《こうじくいき》を囲《かこ》んで、車《くるま》や人《ひと》が入《はい》らないようにするために置《お》くものはどれですか。","a":"バリケードやセーフティコーン","d":["スランプコーンや型枠《かたわく》","トランシットやレベル","バイブレーターやランマー"],"e":"工事区域《こうじくいき》はバリケードやコーンで囲《かこ》み、夜間《やかん》は保安灯《ほあんとう》をつけます。交通誘導員《こうつうゆうどういん》を置《お》いて、車《くるま》や歩行者《ほこうしゃ》を安全《あんぜん》に誘導《ゆうどう》します。"},
{"id":412,"c":"安全管理","q":"硫化水素《りゅうかすいそ》中毒《ちゅうどく》を防《ふせ》ぐため、作業場所《さぎょうばしょ》の空気中《くうきちゅう》の硫化水素《りゅうかすいそ》の濃度《のうど》は何《なん》ppm以下《いか》に保《たも》ちますか。","a":"10ppm","d":["50ppm","100ppm","500ppm"],"e":"硫化水素《りゅうかすいそ》は、下水道《げすいどう》や汚泥《おでい》がたまる所《ところ》などで発生《はっせい》します。酸素《さんそ》18%以上《いじょう》、硫化水素《りゅうかすいそ》10ppm以下《いか》を保《たも》つように換気《かんき》し、濃度《のうど》を測《はか》ってから入《はい》ります。"},
{"id":413,"c":"安全管理","q":"マンホールの中《なか》など、酸素欠乏《さんそけつぼう》の危険《きけん》がある場所《ばしょ》に入《はい》るとき、正《ただ》しいものはどれですか。","a":"入《はい》る前《まえ》に酸素濃度《さんそのうど》を測《はか》り、換気《かんき》をする","d":["においがなければ、すぐに入《はい》ってよい","換気《かんき》のために純酸素《じゅんさんそ》を送《おく》りこむ","まず1人《ひとり》で入《はい》って、中《なか》を確《たし》かめる"],"e":"酸素《さんそ》が少《すく》ない空気《くうき》は、においも色《いろ》もありません。換気《かんき》には空気《くうき》を使《つか》い、純酸素《じゅんさんそ》は火災《かさい》の危険《きけん》があるので使《つか》ってはいけません。外《そと》には監視人《かんしにん》を置《お》きます。"},
{"id":414,"c":"安全管理","q":"マンホールの中《なか》で作業員《さぎょういん》が倒《たお》れているのを見《み》つけました。正《ただ》しい行動《こうどう》はどれですか。","a":"すぐに入《はい》らず人《ひと》を呼《よ》び、空気呼吸器《くうきこきゅうき》を着《つ》けて助《たす》ける","d":["息《いき》を止《と》めて、すぐに中《なか》へ助《たす》けに入《はい》る","防《ぼう》じんマスクを着《つ》けて、中《なか》へ入《はい》る","1人《ひとり》で中《なか》に入《はい》って、急《いそ》いで運《はこ》び出《だ》す"],"e":"あわてて助《たす》けに入《はい》った人《ひと》も倒《たお》れる事故《じこ》がとても多《おお》いです。防《ぼう》じんマスクや防毒《ぼうどく》マスクでは酸素不足《さんそぶそく》は防《ふせ》げません。空気呼吸器《くうきこきゅうき》などを使《つか》って救出《きゅうしゅつ》します。"},
{"id":415,"c":"安全管理","q":"コンクリートのはつりなど、粉《ふん》じんが多《おお》く出《で》る作業《さぎょう》で使《つか》う保護具《ほごぐ》はどれですか。","a":"防《ぼう》じんマスク","d":["耳栓《みみせん》","安全靴《あんぜんぐつ》","溶接用《ようせつよう》の面《めん》"],"e":"粉《ふん》じんを長《なが》い間《あいだ》吸《す》いこむと、じん肺《ぱい》という肺《はい》の病気《びょうき》になります。散水《さんすい》して粉《ふん》じんを減《へ》らし、防《ぼう》じんマスクを顔《かお》にすき間《ま》なく着《つ》けます。"},
{"id":416,"c":"安全管理","q":"大《おお》きな音《おと》が出《で》る作業《さぎょう》を長《なが》い時間《じかん》するとき、耳《みみ》を守《まも》るために使《つか》うものはどれですか。","a":"耳栓《みみせん》やイヤーマフ","d":["防《ぼう》じんメガネ","墜落制止用器具《ついらくせいしようきぐ》","皮《かわ》の手袋《てぶくろ》"],"e":"強《つよ》い騒音《そうおん》の中《なか》で長《なが》く働《はたら》くと、耳《みみ》が聞《き》こえにくくなる騒音性難聴《そうおんせいなんちょう》になります。一度《いちど》悪《わる》くなると、治《なお》りにくいです。"},
{"id":417,"c":"安全管理","q":"チェーンソーやハンドブレーカーなど、振動《しんどう》する工具《こうぐ》を長《なが》い時間《じかん》使《つか》うと起《お》きやすい病気《びょうき》はどれですか。","a":"振動障害《しんどうしょうがい》（白《はく》ろう病《びょう》）","d":["熱中症《ねっちゅうしょう》","じん肺《ぱい》","酸素欠乏症《さんそけつぼうしょう》"],"e":"手《て》や指《ゆび》が白《しろ》くなったり、しびれたりします。1日《にち》の使用時間《しようじかん》を守《まも》り、休《やす》けいをとり、防振手袋《ぼうしんてぶくろ》を使《つか》います。"},
{"id":418,"c":"安全管理","q":"作業床《さぎょうゆか》の高《たか》さが10m以上《いじょう》の高所作業車《こうしょさぎょうしゃ》を運転《うんてん》するのに必要《ひつよう》な資格《しかく》はどれですか。","a":"高所作業車運転技能講習《こうしょさぎょうしゃうんてんぎのうこうしゅう》の修了《しゅうりょう》","d":["高所作業車《こうしょさぎょうしゃ》の特別教育《とくべつきょういく》だけ","足場《あしば》の組立《くみた》て等《とう》作業主任者《さぎょうしゅにんしゃ》","資格《しかく》はいらない"],"e":"作業床《さぎょうゆか》の高《たか》さ10m以上《いじょう》は技能講習《ぎのうこうしゅう》、10m未満《みまん》は特別教育《とくべつきょういく》が必要《ひつよう》です。作業床《さぎょうゆか》の上《うえ》では、原則《げんそく》として墜落制止用器具《ついらくせいしようきぐ》を使《つか》います。"},
{"id":419,"c":"安全管理","q":"ローリングタワー（移動式足場《いどうしきあしば》）を動《うご》かすとき、正《ただ》しいものはどれですか。","a":"上《うえ》に人《ひと》を乗《の》せたまま動《うご》かさない","d":["上《うえ》の人《ひと》が乗《の》ったまま押《お》して動《うご》かす","上《うえ》の人《ひと》が壁《かべ》を押《お》して自分《じぶん》で動《うご》かす","急《いそ》ぐときは乗《の》ったまま動《うご》かしてよい"],"e":"動《うご》かすときは、上《うえ》の人《ひと》を必《かなら》ず降《お》ろします。作業中《さぎょうちゅう》は車輪《しゃりん》のブレーキ（ストッパー）をかけて固定《こてい》します。"},
{"id":420,"c":"安全管理","q":"床《ゆか》の開口部《かいこうぶ》（穴《あな》）から人《ひと》が落《お》ちないようにする方法《ほうほう》として、正《ただ》しいものはどれですか。","a":"手《て》すりで囲《かこ》うか、丈夫《じょうぶ》なふたをして固定《こてい》する","d":["ブルーシートを上《うえ》にかけておくだけにする","「注意《ちゅうい》」と書《か》いた紙《かみ》をはるだけにする","穴《あな》の近《ちか》くを暗《くら》くして、人《ひと》を通《とお》さない"],"e":"シートをかけるだけでは穴《あな》が見《み》えず、かえって踏《ふ》み抜《ぬ》いて落《お》ちる危険《きけん》があります。ふたは動《うご》かないように固定《こてい》し、「開口部《かいこうぶ》注意《ちゅうい》」と表示《ひょうじ》します。"},
{"id":421,"c":"安全管理","q":"玉掛《たまか》け用《よう》ワイヤロープで、使《つか》ってはいけないものはどれですか。","a":"キンク（よじれて折《お》れ曲《ま》がった跡《あと》）があるもの","d":["表面《ひょうめん》にうすく油《あぶら》が付《つ》いているもの","使《つか》う前《まえ》の点検《てんけん》で異常《いじょう》がなかったもの","つり荷《に》に合《あ》った太《ふと》さのもの"],"e":"キンクしたもの、1よりの間《あいだ》で素線《そせん》の10%以上《いじょう》が切《き》れているもの、直径《ちょっけい》が7%をこえて細《ほそ》くなったもの、形《かたち》がひどく崩《くず》れたりさびたりしたものは使《つか》えません。"},
{"id":422,"c":"安全管理","q":"クレーンでつり荷《に》を少《すこ》しだけ持《も》ち上《あ》げた（地切《じぎ》りした）とき、することはどれですか。","a":"いったん止《と》めて、荷《に》のバランスや掛《か》け方《かた》を確《たし》かめる","d":["止《と》めずに、そのまま一気《いっき》に高《たか》く上《あ》げる","荷《に》の下《した》に入《はい》って、底《そこ》を確《たし》かめる","手《て》で荷《に》を押《お》して、早《はや》く回《まわ》す"],"e":"地切《じぎ》りでいったん止《と》め、荷《に》がかたむいていないか、ワイヤーがずれていないかを確《たし》かめてから巻《ま》き上《あ》げます。おかしいときは荷《に》を下《お》ろして掛《か》け直《なお》します。"},
{"id":423,"c":"安全管理","q":"移動式《いどうしき》クレーンやバックホウを使《つか》う場所《ばしょ》の上《うえ》に電線《でんせん》があるとき、正《ただ》しい対策《たいさく》はどれですか。","a":"電線《でんせん》に防護管《ぼうごかん》を付《つ》けてもらい、監視人《かんしにん》を置《お》く","d":["ブームで電線《でんせん》を少《すこ》し持《も》ち上《あ》げて作業《さぎょう》する","電線《でんせん》にさわらなければ、いくら近《ちか》づいてもよい","雨《あめ》の日《ひ》だけ注意《ちゅうい》すればよい"],"e":"電線《でんせん》に近《ちか》づくだけで、電気《でんき》が飛《と》んで感電《かんでん》することがあります。電力会社《でんりょくがいしゃ》に相談《そうだん》して防護管《ぼうごかん》を付《つ》け、離《はな》れる距離《きょり》を決《き》めて監視人《かんしにん》を置《お》きます。"},
{"id":424,"c":"安全管理","q":"熱中症《ねっちゅうしょう》のようすの作業員《さぎょういん》が、呼《よ》びかけに正《ただ》しく答《こた》えられないとき、正《ただ》しい対応《たいおう》はどれですか。","a":"すぐに救急車《きゅうきゅうしゃ》を呼《よ》び、涼《すず》しい所《ところ》で体《からだ》を冷《ひ》やす","d":["水《みず》を無理《むり》に飲《の》ませて、作業《さぎょう》に戻《もど》す","日《ひ》なたで横《よこ》にして、様子《ようす》を見《み》る","1人《ひとり》で休《やす》ませて、だれも付《つ》かない"],"e":"意識《いしき》がおかしいときは重《おも》い熱中症《ねっちゅうしょう》です。首《くび》・わきの下《した》・足《あし》の付《つ》け根《ね》を冷《ひ》やします。意識《いしき》がはっきりしない人《ひと》に、無理《むり》に水《みず》を飲《の》ませてはいけません。"},
{"id":425,"c":"安全管理","q":"けがで血《ち》がたくさん出《で》ているとき、まずする応急手当《おうきゅうてあて》はどれですか。","a":"きれいな布《ぬの》で傷口《きずぐち》を強《つよ》く押《お》さえる","d":["傷口《きずぐち》を温《あたた》めて、血《ち》を流《なが》す","傷口《きずぐち》に土《つち》をかけて、血《ち》を止《と》める","何《なに》もしないで、血《ち》が止《と》まるのを待《ま》つ"],"e":"傷口《きずぐち》を直接《ちょくせつ》強《つよ》く押《お》さえる「直接圧迫止血《ちょくせつあっぱくしけつ》」が基本《きほん》です。血《ち》にふれないよう、ビニール手袋《てぶくろ》などを使《つか》います。"},
{"id":426,"c":"安全管理","q":"倒《たお》れた人《ひと》に反応《はんのう》がなく、ふだんどおりの呼吸《こきゅう》もないとき、まずすることはどれですか。","a":"119番《ばん》に通報《つうほう》し、AEDを頼《たの》み、胸骨圧迫《きょうこつあっぱく》を始《はじ》める","d":["顔《かお》に水《みず》をかけて、目《め》をさまさせようとする","体《からだ》を起《お》こして、歩《ある》けるかどうか試《ため》す","そのまま寝《ね》かせて、しばらく様子《ようす》を見《み》る"],"e":"胸骨圧迫《きょうこつあっぱく》（心臓《しんぞう》マッサージ）は、胸《むね》の真《ま》ん中《なか》を強《つよ》く、速《はや》く、絶《た》え間《ま》なく押《お》します。AEDが来《き》たら、音声《おんせい》の指示《しじ》に従《したが》って使《つか》います。"},
{"id":427,"c":"安全管理","q":"会社《かいしゃ》が労働者《ろうどうしゃ》に行《おこな》う定期健康診断《ていきけんこうしんだん》は、何年《なんねん》以内《いない》ごとに1回《かい》行《おこな》いますか。","a":"1年《ねん》以内《いない》ごと","d":["2年《ねん》以内《いない》ごと","3年《ねん》以内《いない》ごと","5年《ねん》以内《いない》ごと"],"e":"定期健康診断《ていきけんこうしんだん》は1年《ねん》以内《いない》ごとに1回《かい》です。雇《やと》い入《い》れのときにも健康診断《けんこうしんだん》を行《おこな》います。深夜《しんや》の仕事《しごと》など特定《とくてい》の業務《ぎょうむ》では、6か月《げつ》以内《いない》ごとに1回《かい》です。"},
{"id":428,"c":"安全管理","q":"リスクアセスメントの正《ただ》しい順番《じゅんばん》はどれですか。","a":"危険《きけん》を見《み》つける→リスクを見積《みつ》もる→対策《たいさく》を実施《じっし》する","d":["対策《たいさく》を実施《じっし》する→危険《きけん》を見《み》つける→リスクを見積《みつ》もる","リスクを見積《みつ》もる→対策《たいさく》を実施《じっし》する→危険《きけん》を見《み》つける","危険《きけん》を見《み》つける→対策《たいさく》を実施《じっし》する→リスクを見積《みつ》もる"],"e":"まず作業《さぎょう》の中《なか》の危険《きけん》を見《み》つけ、けがの重《おも》さと起《お》こりやすさでリスクを見積《みつ》もります。リスクの大《おお》きいものから対策《たいさく》を決《き》めて実施《じっし》し、記録《きろく》します。"},
{"id":429,"c":"安全管理","q":"リスクを下《さ》げる対策《たいさく》で、いちばん先《さき》に考《かんが》えるものはどれですか。","a":"危険《きけん》な作業《さぎょう》そのものをなくす、または変《か》える","d":["保護具《ほごぐ》を使《つか》うように指示《しじ》する","「注意《ちゅうい》」の看板《かんばん》を立《た》てる","作業員《さぎょういん》に気《き》を付《つ》けるよう言《い》う"],"e":"順番《じゅんばん》は、①危険《きけん》をなくす・減《へ》らす（本質的対策《ほんしつてきたいさく》）、②設備《せつび》の対策《たいさく》、③ルールや教育《きょういく》、④保護具《ほごぐ》、です。保護具《ほごぐ》は最後《さいご》の手段《しゅだん》です。"},
{"id":430,"c":"安全管理","q":"ヒューマンエラー（人《ひと》のミス）を減《へ》らす方法《ほうほう》として、正《ただ》しくないものはどれですか。","a":"作業《さぎょう》を急《いそ》がせて、時間《じかん》を短《みじか》くする","d":["指差《ゆびさ》し呼称《こしょう》をする","作業手順書《さぎょうてじゅんしょ》をわかりやすくする","2人《ふたり》でダブルチェックをする"],"e":"急《いそ》ぐと、確認《かくにん》をとばしたり、思《おも》いこみで作業《さぎょう》したりして、ミスが増《ふ》えます。疲《つか》れや睡眠不足《すいみんぶそく》もミスの原因《げんいん》になります。"},
{"id":431,"c":"施工管理","q":"工事《こうじ》を始《はじ》める前《まえ》に、工事《こうじ》の進《すす》め方《かた》・使《つか》う機械《きかい》・安全対策《あんぜんたいさく》などをまとめた書類《しょるい》はどれですか。","a":"施工計画書《せこうけいかくしょ》","d":["竣工図《しゅんこうず》","作業日報《さぎょうにっぽう》","請求書《せいきゅうしょ》"],"e":"施工計画書《せこうけいかくしょ》には、工法《こうほう》・工程《こうてい》・品質管理《ひんしつかんり》・安全管理《あんぜんかんり》・環境対策《かんきょうたいさく》などを書《か》きます。竣工図《しゅんこうず》は、でき上《あ》がった後《あと》の状態《じょうたい》をかいた図面《ずめん》です。"},
{"id":432,"c":"施工管理","q":"下請《したうけ》の会社《かいしゃ》も含《ふく》めて、どの会社《かいしゃ》が工事《こうじ》のどの部分《ぶぶん》を担当《たんとう》しているかを表《あらわ》し、現場《げんば》に掲示《けいじ》する図《ず》はどれですか。","a":"施工体系図《せこうたいけいず》","d":["工程表《こうていひょう》","配筋図《はいきんず》","平面図《へいめんず》"],"e":"施工体系図《せこうたいけいず》を見《み》ると、元請《もとうけ》・下請《したうけ》の関係《かんけい》や技術者《ぎじゅつしゃ》の名前《なまえ》がわかります。くわしい内容《ないよう》は施工体制台帳《せこうたいせいだいちょう》にまとめます。"},
{"id":433,"c":"施工管理","q":"工事《こうじ》がどれだけ進《すす》んだかを、金額《きんがく》や量《りょう》で表《あらわ》したものを何《なん》といいますか。","a":"出来高《できだか》","d":["工期《こうき》","予算《よさん》","歩掛《ぶがかり》"],"e":"計画《けいかく》の出来高《できだか》と実際《じっさい》の出来高《できだか》を比《くら》べて、工事《こうじ》が遅《おく》れていないかを確《たし》かめます。歩掛《ぶがかり》は、ある作業《さぎょう》に必要《ひつよう》な人《ひと》や時間《じかん》の目安《めやす》です。"},
{"id":434,"c":"施工管理","q":"工程管理曲線《こうていかんりきょくせん》（バナナ曲線《きょくせん》）で、実際《じっさい》の出来高《できだか》の線《せん》が上《うえ》と下《した》の許容限界《きょようげんかい》の線《せん》の間《あいだ》にあるとき、どう判断《はんだん》しますか。","a":"工程《こうてい》はおおむね計画《けいかく》どおり進《すす》んでいる","d":["工程《こうてい》が大《おお》きく遅《おく》れている","工程《こうてい》が進《すす》みすぎて危険《きけん》である","品質《ひんしつ》が悪《わる》くなっている"],"e":"線《せん》が下《した》の限界《げんかい》より下《した》なら遅《おく》れ、上《うえ》の限界《げんかい》より上《うえ》なら進《すす》みすぎです。進《すす》みすぎも、むだや品質《ひんしつ》の低下《ていか》につながることがあります。"},
{"id":435,"c":"施工管理","q":"工事《こうじ》の出来高《できだか》を累計《るいけい》でグラフにすると、初《はじ》めと終《お》わりがゆるやかで、中《なか》ごろが急《きゅう》な線《せん》になります。この曲線《きょくせん》を何《なん》といいますか。","a":"Sカーブ（S字曲線《じきょくせん》）","d":["バーチャート","ヒストグラム","管理図《かんりず》"],"e":"工事《こうじ》の初《はじ》めは準備《じゅんび》が多《おお》く、終《お》わりは片付《かたづ》けや仕上《しあ》げが多《おお》いので、出来高《できだか》の増《ふ》え方《かた》がゆるやかになります。予定《よてい》のSカーブと実際《じっさい》を比《くら》べて進《すす》み具合《ぐあい》を見《み》ます。"},
{"id":436,"c":"施工管理","q":"たくさんの製品《せいひん》の中《なか》からいくつかを取《と》り出《だ》して検査《けんさ》し、全体《ぜんたい》の合格《ごうかく》・不合格《ふごうかく》を判断《はんだん》する方法《ほうほう》はどれですか。","a":"抜取検査《ぬきとりけんさ》","d":["全数検査《ぜんすうけんさ》","打診検査《だしんけんさ》","竣工検査《しゅんこうけんさ》"],"e":"抜取検査《ぬきとりけんさ》は、全部《ぜんぶ》を調《しら》べるのがむずかしいときに使《つか》います。コンクリートの圧縮強度試験《あっしゅくきょうどしけん》も、試験用《しけんよう》の供試体《きょうしたい》を取《と》って調《しら》べる抜取検査《ぬきとりけんさ》です。"},
{"id":437,"c":"施工管理","q":"でき上《あ》がった構造物《こうぞうぶつ》の寸法《すんぽう》・高《たか》さ・位置《いち》が、設計図《せっけいず》どおりかを確《たし》かめる管理《かんり》を何《なん》といいますか。","a":"出来形管理《できがたかんり》","d":["原価管理《げんかかんり》","労務管理《ろうむかんり》","工程管理《こうていかんり》"],"e":"出来形管理《できがたかんり》では、長《なが》さ・幅《はば》・厚《あつ》さ・高《たか》さなどを測《はか》り、決《き》められた範囲《はんい》（規格値《きかくち》）に入《はい》っているかを確《たし》かめ、記録《きろく》します。"},
{"id":438,"c":"施工管理","q":"工事写真《こうじしゃしん》を特《とく》に忘《わす》れずに撮《と》っておかなければならないのは、どんな部分《ぶぶん》ですか。","a":"あとで埋《う》まって見《み》えなくなる部分《ぶぶん》","d":["完成後《かんせいご》もいつでも見《み》られる部分《ぶぶん》","工事《こうじ》に関係《かんけい》のない場所《ばしょ》","現場事務所《げんばじむしょ》の中《なか》のようす"],"e":"鉄筋《てっきん》・基礎《きそ》・埋設管《まいせつかん》などは、完成後《かんせいご》は見《み》えなくなります。小黒板《しょうこくばん》に工事名《こうじめい》・場所《ばしょ》・内容《ないよう》・寸法《すんぽう》などを書《か》いて、一緒《いっしょ》に写《うつ》します。"},
{"id":439,"c":"施工管理","q":"工事費《こうじひ》のうち、材料費《ざいりょうひ》・労務費《ろうむひ》・機械《きかい》の費用《ひよう》など、工事《こうじ》の目的物《もくてきぶつ》を作《つく》るために直接《ちょくせつ》かかる費用《ひよう》はどれですか。","a":"直接工事費《ちょくせつこうじひ》","d":["現場管理費《げんばかんりひ》","一般管理費《いっぱんかんりひ》","共通仮設費《きょうつうかせつひ》"],"e":"共通仮設費《きょうつうかせつひ》と現場管理費《げんばかんりひ》をあわせて間接工事費《かんせつこうじひ》といいます。一般管理費《いっぱんかんりひ》は、本社《ほんしゃ》の運営《うんえい》などにかかる費用《ひよう》です。"},
{"id":440,"c":"施工管理","q":"作業手順書《さぎょうてじゅんしょ》を作《つく》る目的《もくてき》として、正《ただ》しいものはどれですか。","a":"だれが作業《さぎょう》しても、安全《あんぜん》に同《おな》じ品質《ひんしつ》でできるようにする","d":["作業《さぎょう》の時間《じかん》をできるだけ長《なが》くする","作業員《さぎょういん》の給料《きゅうりょう》の金額《きんがく》を決《き》める","ベテランの作業員《さぎょういん》だけが仕事《しごと》を覚《おぼ》える"],"e":"作業手順書《さぎょうてじゅんしょ》には、作業《さぎょう》の順番《じゅんばん》・急所《きゅうしょ》（ポイント）・危険《きけん》と対策《たいさく》を書《か》きます。新《あたら》しい作業員《さぎょういん》の教育《きょういく》にも使《つか》えます。"},
{"id":441,"c":"施工管理","q":"現場《げんば》で実際《じっさい》に仕事《しごと》をしながら、先輩《せんぱい》や班長《はんちょう》が後輩《こうはい》に仕事《しごと》を教《おし》える方法《ほうほう》を何《なん》といいますか。","a":"OJT","d":["Off-JT","KYT","QC"],"e":"OJTは「On the Job Training」の略《りゃく》です。職場《しょくば》を離《はな》れて講習会《こうしゅうかい》などで学《まな》ぶことはOff-JTといいます。"},
{"id":442,"c":"施工管理","q":"作業《さぎょう》の指示《しじ》は「5W1H」で伝《つた》えるとよいといわれます。「1H」は何《なに》を表《あらわ》していますか。","a":"どのように（How）","d":["だれが（Who）","なぜ（Why）","どこで（Where）"],"e":"5Wは、いつ（When）・どこで（Where）・だれが（Who）・何《なに》を（What）・なぜ（Why）です。これに「どのように（How）」を加《くわ》えると、指示《しじ》がはっきり伝《つた》わります。"},
{"id":443,"c":"施工管理","q":"仕事《しごと》で大切《たいせつ》な「ホウ・レン・ソウ」とは何《なん》のことですか。","a":"報告《ほうこく》・連絡《れんらく》・相談《そうだん》","d":["放送《ほうそう》・練習《れんしゅう》・掃除《そうじ》","報告《ほうこく》・練習《れんしゅう》・相談《そうだん》","放送《ほうそう》・連絡《れんらく》・掃除《そうじ》"],"e":"ミスや事故《じこ》、悪《わる》い知《し》らせほど、早《はや》く報告《ほうこく》することが大切《たいせつ》です。わからないことは、自分《じぶん》で判断《はんだん》せずに相談《そうだん》します。"},
{"id":444,"c":"施工管理","q":"日本語《にほんご》がまだ得意《とくい》でない作業員《さぎょういん》に指示《しじ》を出《だ》すとき、よい方法《ほうほう》はどれですか。","a":"短《みじか》い文《ぶん》で、実物《じつぶつ》や図《ず》を見《み》せながら伝《つた》える","d":["専門用語《せんもんようご》をたくさん使《つか》って速《はや》く話《はな》す","1回《かい》だけ言《い》って、わかったか確認《かくにん》しない","大《おお》きな声《こえ》でどなって伝《つた》える"],"e":"やさしい日本語《にほんご》で、1つの文《ぶん》に1つの内容《ないよう》にします。最後《さいご》に指示《しじ》を復唱《ふくしょう》してもらい、正《ただ》しく伝《つた》わったか確《たし》かめます。"},
{"id":445,"c":"施工管理","q":"「手戻《てもど》り」を防《ふせ》ぐ方法《ほうほう》として、正《ただ》しいものはどれですか。","a":"作業前《さぎょうまえ》に図面《ずめん》を確認《かくにん》し、途中《とちゅう》でも検査《けんさ》をする","d":["図面《ずめん》を見《み》ないで、経験《けいけん》だけで作《つく》る","検査《けんさ》は全部《ぜんぶ》終《お》わってから1回《かい》だけする","問題《もんだい》があっても、次《つぎ》の工程《こうてい》に進《すす》む"],"e":"手戻《てもど》りとは、やり直《なお》しのことです。手戻《てもど》りがあると、工期《こうき》も費用《ひよう》も増《ふ》えます。工程《こうてい》ごとに確認《かくにん》してから次《つぎ》に進《すす》みます。"},
{"id":446,"c":"施工管理","q":"ドローンやGNSSなどを使《つか》う「ICT施工《せこう》」の目的《もくてき》として、正《ただ》しいものはどれですか。","a":"測量《そくりょう》や施工《せこう》を早《はや》く正確《せいかく》にし、人手不足《ひとでぶそく》を補《おぎな》う","d":["作業員《さぎょういん》の安全教育《あんぜんきょういく》をなくす","設計図《せっけいず》を使《つか》わないで工事《こうじ》をする","でき上《あ》がりの検査《けんさ》をしなくてよくする"],"e":"ドローンで地形《ちけい》を3次元《じげん》で測《はか》ったり、ICT建設機械《けんせつきかい》で自動《じどう》で整地《せいち》したりします。国土交通省《こくどこうつうしょう》は「i-Construction」として進《すす》めています。"},
{"id":447,"c":"施工管理","q":"建物《たてもの》や構造物《こうぞうぶつ》を3次元《じげん》のデジタルモデルで作《つく》り、設計《せっけい》から施工《せこう》・維持管理《いじかんり》まで情報《じょうほう》を共有《きょうゆう》するしくみはどれですか。","a":"BIM／CIM","d":["TBM","PDCA","4S"],"e":"主《おも》に建築《けんちく》ではBIM、土木《どぼく》ではCIMと呼《よ》ばれてきました。今《いま》はまとめてBIM／CIMともいいます。図面《ずめん》の食《く》い違《ちが》いを前《まえ》もって見《み》つけるのに役立《やくだ》ちます。"},
{"id":448,"c":"施工管理","q":"コンクリートや鉄筋《てっきん》などの材料《ざいりょう》が現場《げんば》に届《とど》いたとき、まずすることはどれですか。","a":"注文《ちゅうもん》どおりか、規格《きかく》や数量《すうりょう》を確《たし》かめる","d":["確《たし》かめないで、すぐに使《つか》い始《はじ》める","雨《あめ》の当《あ》たる所《ところ》に置《お》いたままにする","数《かず》だけ数《かぞ》えて、規格《きかく》は見《み》ない"],"e":"これを受入検査《うけいれけんさ》といいます。納品書《のうひんしょ》や鉄筋《てっきん》のミルシート（品質《ひんしつ》の証明書《しょうめいしょ》）を確認《かくにん》し、コンクリートはスランプなどを試験《しけん》します。"},
{"id":449,"c":"施工管理","q":"その日《ひ》の作業内容《さぎょうないよう》・人数《にんずう》・天気《てんき》などを毎日《まいにち》記録《きろく》するものはどれですか。","a":"作業日報《さぎょうにっぽう》","d":["施工体系図《せこうたいけいず》","工程表《こうていひょう》","竣工図《しゅんこうず》"],"e":"作業日報《さぎょうにっぽう》は、工程《こうてい》の管理《かんり》や原価《げんか》の計算《けいさん》、トラブルがあったときの確認《かくにん》に使《つか》う大切《たいせつ》な記録《きろく》です。"},
{"id":450,"c":"施工管理","q":"工程《こうてい》が遅《おく》れたときの対策《たいさく》として、正《ただ》しくないものはどれですか。","a":"安全確認《あんぜんかくにん》を省《はぶ》いて、作業《さぎょう》を急《いそ》ぐ","d":["作業《さぎょう》の順番《じゅんばん》や方法《ほうほう》を見直《みなお》す","人《ひと》や機械《きかい》を増《ふ》やす","同時《どうじ》にできる作業《さぎょう》を並行《へいこう》して進《すす》める"],"e":"遅《おく》れを取《と》り戻《もど》すときも、安全《あんぜん》と品質《ひんしつ》は守《まも》らなければなりません。無理《むり》に急《いそ》ぐと事故《じこ》や手戻《てもど》りが起《お》き、かえって遅《おく》れます。"},
{"id":451,"c":"法規・環境","q":"建設業《けんせつぎょう》の許可《きょか》について、正《ただ》しいものはどれですか。","a":"軽微《けいび》な工事《こうじ》だけをするなら、許可《きょか》はなくてもよい","d":["どんなに小《ちい》さな工事《こうじ》でも、必《かなら》ず許可《きょか》がいる","許可《きょか》は一度《いちど》取《と》れば、更新《こうしん》はいらない","許可《きょか》は作業員《さぎょういん》1人《ひとり》ずつが取《と》る"],"e":"建設業《けんせつぎょう》の許可《きょか》は会社《かいしゃ》（または個人事業主《こじんじぎょうぬし》）が取《と》り、有効期間《ゆうこうきかん》は5年《ねん》です。続《つづ》けるには更新《こうしん》が必要《ひつよう》です。"},
{"id":452,"c":"法規・環境","q":"建設業者《けんせつぎょうしゃ》が工事現場《こうじげんば》に置《お》き、施工計画《せこうけいかく》・工程《こうてい》・品質《ひんしつ》の管理《かんり》や、技術上《ぎじゅつじょう》の指導監督《しどうかんとく》をする技術者《ぎじゅつしゃ》はどれですか。","a":"主任技術者《しゅにんぎじゅつしゃ》","d":["交通誘導員《こうつうゆうどういん》","火元責任者《ひもとせきにんしゃ》","玉掛《たまか》け者《しゃ》"],"e":"建設業者《けんせつぎょうしゃ》は、請《う》け負《お》った工事現場《こうじげんば》に主任技術者《しゅにんぎじゅつしゃ》を置《お》きます。大《おお》きな工事《こうじ》で多《おお》くの下請《したうけ》を使《つか》う元請《もとうけ》は、監理技術者《かんりぎじゅつしゃ》を置《お》きます。"},
{"id":453,"c":"法規・環境","q":"請《う》け負《お》った工事《こうじ》を、そのまま全部《ぜんぶ》ほかの会社《かいしゃ》に請《う》け負《お》わせることを何《なん》といい、どうなっていますか。","a":"一括下請負《いっかつしたうけおい》といい、原則《げんそく》禁止《きんし》","d":["共同企業体《きょうどうきぎょうたい》といい、自由《じゆう》にできる","一括下請負《いっかつしたうけおい》といい、自由《じゆう》にできる","元請負《もとうけおい》といい、必《かなら》ずしなければならない"],"e":"いわゆる「丸投《まるな》げ」です。発注者《はっちゅうしゃ》の信頼《しんらい》を裏切《うらぎ》り、責任《せきにん》もあいまいになるので禁止《きんし》されています。公共工事《こうきょうこうじ》では例外《れいがい》なく禁止《きんし》です。"},
{"id":454,"c":"法規・環境","q":"労働基準法《ろうどうきじゅんほう》の法定労働時間《ほうていろうどうじかん》は、原則《げんそく》として何時間《なんじかん》ですか。","a":"1日《にち》8時間《じかん》・1週《しゅう》40時間《じかん》","d":["1日《にち》10時間《じかん》・1週《しゅう》50時間《じかん》","1日《にち》8時間《じかん》・1週《しゅう》48時間《じかん》","1日《にち》6時間《じかん》・1週《しゅう》30時間《じかん》"],"e":"これをこえて働《はたら》かせるには、36協定《きょうてい》を結《むす》んで届《とど》け出《で》て、割増賃金《わりましちんぎん》（残業代《ざんぎょうだい》）を払《はら》う必要《ひつよう》があります。"},
{"id":455,"c":"法規・環境","q":"労働時間《ろうどうじかん》が6時間《じかん》をこえて8時間《じかん》以下《いか》のとき、休憩《きゅうけい》は少《すく》なくとも何分《なんぷん》必要《ひつよう》ですか。","a":"45分《ふん》","d":["15分《ふん》","30分《ぷん》","60分《ぷん》"],"e":"6時間《じかん》をこえると45分《ふん》以上《いじょう》、8時間《じかん》をこえると60分《ぷん》以上《いじょう》の休憩《きゅうけい》が必要《ひつよう》です。休憩《きゅうけい》は労働時間《ろうどうじかん》の途中《とちゅう》に与《あた》えます。"},
{"id":456,"c":"法規・環境","q":"法定労働時間《ほうていろうどうじかん》をこえて残業《ざんぎょう》をさせるために、会社《かいしゃ》と労働者《ろうどうしゃ》の代表《だいひょう》が結《むす》び、労働基準監督署《ろうどうきじゅんかんとくしょ》に届《とど》け出《で》る協定《きょうてい》はどれですか。","a":"36（サブロク）協定《きょうてい》","d":["下請契約《したうけけいやく》","請負契約《うけおいけいやく》","雇用契約書《こようけいやくしょ》"],"e":"労働基準法《ろうどうきじゅんほう》の第《だい》36条《じょう》に決《き》められているので、36協定《きょうてい》と呼《よ》びます。協定《きょうてい》があっても、残業《ざんぎょう》には上限《じょうげん》があります。"},
{"id":457,"c":"法規・環境","q":"時間外労働《じかんがいろうどう》（残業《ざんぎょう》）の上限規制《じょうげんきせい》が、建設業《けんせつぎょう》にも適用《てきよう》されるようになったのはいつからですか。","a":"2024年《ねん》4月《がつ》","d":["2010年《ねん》4月《がつ》","2019年《ねん》4月《がつ》","2030年《ねん》4月《がつ》"],"e":"建設業《けんせつぎょう》は5年間《ねんかん》猶予《ゆうよ》されていましたが、2024年《ねん》4月《がつ》から適用《てきよう》されました。残業《ざんぎょう》は原則《げんそく》として月《つき》45時間《じかん》・年《ねん》360時間《じかん》までです。"},
{"id":458,"c":"法規・環境","q":"労働基準法《ろうどうきじゅんほう》で、会社《かいしゃ》が労働者《ろうどうしゃ》に与《あた》えなければならない休日《きゅうじつ》はどれですか。","a":"毎週《まいしゅう》少《すく》なくとも1回《かい》","d":["毎月《まいつき》少《すく》なくとも1回《かい》","2週間《しゅうかん》に少《すく》なくとも1回《かい》","1年《ねん》に少《すく》なくとも30日《にち》"],"e":"休日《きゅうじつ》は毎週《まいしゅう》少《すく》なくとも1回《かい》与《あた》えます（4週間《しゅうかん》で4日《か》以上《いじょう》とする方法《ほうほう》もあります）。建設業界《けんせつぎょうかい》では「週休《しゅうきゅう》2日《か》」を進《すす》めています。"},
{"id":459,"c":"法規・環境","q":"「技能講習《ぎのうこうしゅう》」「特別教育《とくべつきょういく》」「免許《めんきょ》」について、正《ただ》しいものはどれですか。","a":"技能講習《ぎのうこうしゅう》は登録《とうろく》された機関《きかん》で受《う》け、修了証《しゅうりょうしょう》をもらう","d":["特別教育《とくべつきょういく》は、国《くに》の試験《しけん》に合格《ごうかく》しないと受《う》けられない","免許《めんきょ》は、会社《かいしゃ》が社内《しゃない》で自由《じゆう》に出《だ》せる","技能講習《ぎのうこうしゅう》は、だれも受《う》けなくてよい"],"e":"特別教育《とくべつきょういく》は事業者《じぎょうしゃ》（会社《かいしゃ》）が行《おこな》います。免許《めんきょ》はクレーン運転士《うんてんし》などで、国《くに》の試験《しけん》に合格《ごうかく》して取《と》ります。危険《きけん》な作業《さぎょう》ほど、必要《ひつよう》な資格《しかく》が重《おも》くなります。"},
{"id":460,"c":"法規・環境","q":"6か月《げつ》続《つづ》けて働《はたら》き、決《き》められた日《ひ》の8割《わり》以上《いじょう》出勤《しゅっきん》した労働者《ろうどうしゃ》に与《あた》える年次有給休暇《ねんじゆうきゅうきゅうか》は何日《なんにち》ですか。","a":"10日《か》","d":["5日《か》","15日《にち》","20日《か》"],"e":"年次有給休暇《ねんじゆうきゅうきゅうか》は、休《やす》んでも給料《きゅうりょう》が払《はら》われる休暇《きゅうか》です。働《はたら》く年数《ねんすう》が増《ふ》えると日数《にっすう》も増《ふ》えます。10日《か》以上《いじょう》ある人《ひと》には、年《ねん》5日《か》を必《かなら》ず取《と》らせることになっています。"},
{"id":461,"c":"法規・環境","q":"建設《けんせつ》リサイクル法《ほう》の「特定建設資材《とくていけんせつしざい》」に入《はい》らないものはどれですか。","a":"石《せっ》こうボード","d":["コンクリート","木材《もくざい》","アスファルト・コンクリート"],"e":"特定建設資材《とくていけんせつしざい》は、コンクリート、コンクリートと鉄《てつ》からできた資材《しざい》、木材《もくざい》、アスファルト・コンクリートの4つです。分別《ぶんべつ》して再資源化《さいしげんか》します。"},
{"id":462,"c":"法規・環境","q":"建設《けんせつ》リサイクル法《ほう》で、一定《いってい》の規模《きぼ》以上《いじょう》の工事《こうじ》で行《おこな》わなければならないことはどれですか。","a":"分別解体《ぶんべつかいたい》と再資源化《さいしげんか》","d":["すべてまとめて埋《う》め立《た》てる","現場《げんば》で燃《も》やして処分《しょぶん》する","解体材《かいたいざい》を近《ちか》くの空《あ》き地《ち》に置《お》く"],"e":"たとえば建物《たてもの》の解体《かいたい》では、床面積《ゆかめんせき》の合計《ごうけい》が80㎡以上《いじょう》だと対象《たいしょう》になります。資材《しざい》の種類《しゅるい》ごとに分《わ》けて解体《かいたい》し、リサイクルします。"},
{"id":463,"c":"法規・環境","q":"産業廃棄物《さんぎょうはいきぶつ》を処理業者《しょりぎょうしゃ》に渡《わた》すとき、正《ただ》しく処理《しょり》されたかを確《たし》かめるために使《つか》う伝票《でんぴょう》はどれですか。","a":"マニフェスト","d":["ミルシート","納品書《のうひんしょ》","作業日報《さぎょうにっぽう》"],"e":"マニフェスト（産業廃棄物管理票《さんぎょうはいきぶつかんりひょう》）で、運搬《うんぱん》から最終処分《さいしゅうしょぶん》までの流《なが》れを確認《かくにん》し、不法投棄《ふほうとうき》を防《ふせ》ぎます。電子《でんし》マニフェストもあります。"},
{"id":464,"c":"法規・環境","q":"建設工事《けんせつこうじ》で出《で》た産業廃棄物《さんぎょうはいきぶつ》について、処理《しょり》の責任《せきにん》をもつ「排出事業者《はいしゅつじぎょうしゃ》」はだれですか。","a":"元請業者《もとうけぎょうしゃ》","d":["下請業者《したうけぎょうしゃ》","発注者《はっちゅうしゃ》","作業員《さぎょういん》本人《ほんにん》"],"e":"建設工事《けんせつこうじ》の廃棄物《はいきぶつ》は、元請業者《もとうけぎょうしゃ》が排出事業者《はいしゅつじぎょうしゃ》になります。元請《もとうけ》は、許可《きょか》をもつ処理業者《しょりぎょうしゃ》と契約《けいやく》して処理《しょり》をまかせます。"},
{"id":465,"c":"法規・環境","q":"現場《げんば》で出《で》た木《き》くずや段《だん》ボールの処理《しょり》として、正《ただ》しいものはどれですか。","a":"分別《ぶんべつ》して、許可《きょか》のある業者《ぎょうしゃ》に処理《しょり》を頼《たの》む","d":["現場《げんば》で燃《も》やして処分《しょぶん》する","現場《げんば》の土《つち》の中《なか》に埋《う》める","近《ちか》くの川《かわ》に流《なが》す"],"e":"廃棄物《はいきぶつ》を現場《げんば》で燃《も》やすこと（野焼《のや》き）や、勝手《かって》に捨《す》てること（不法投棄《ふほうとうき》）は、法律《ほうりつ》で禁止《きんし》されています。"},
{"id":466,"c":"法規・環境","q":"騒音規制法《そうおんきせいほう》・振動規制法《しんどうきせいほう》の「特定建設作業《とくていけんせつさぎょう》」をするとき、市町村長《しちょうそんちょう》への届出《とどけで》は、作業《さぎょう》を始《はじ》める何日《なんにち》前《まえ》までですか。","a":"7日《か》前《まえ》","d":["前日《ぜんじつ》","3日《か》前《まえ》","30日《にち》前《まえ》"],"e":"くい打機《うちき》やさく岩機《がんき》などを使《つか》う作業《さぎょう》が特定建設作業《とくていけんせつさぎょう》です。7日《か》前《まえ》までに届《とど》け出《で》ます。災害《さいがい》などの緊急《きんきゅう》の場合《ばあい》は、できるだけ早《はや》く届《とど》け出《で》ます。"},
{"id":467,"c":"法規・環境","q":"工事《こうじ》の騒音《そうおん》を少《すく》なくするための対策《たいさく》として、正《ただ》しいものはどれですか。","a":"低騒音型《ていそうおんがた》の建設機械《けんせつきかい》を使《つか》う","d":["夜《よる》おそくや早朝《そうちょう》に作業《さぎょう》する","エンジンを全開《ぜんかい》にして早《はや》く終《お》わらせる","防音《ぼうおん》シートを外《はず》して風通《かぜとお》しをよくする"],"e":"低騒音型《ていそうおんがた》・低振動型《ていしんどうがた》の機械《きかい》を使《つか》い、防音《ぼうおん》シートや防音壁《ぼうおんへき》を設《もう》けます。アイドリングをやめることも効果《こうか》があります。"},
{"id":468,"c":"法規・環境","q":"建物《たてもの》の解体《かいたい》や改修《かいしゅう》の工事《こうじ》を始《はじ》める前《まえ》に、必《かなら》ずしなければならないことはどれですか。","a":"石綿《いしわた》（アスベスト）の事前調査《じぜんちょうさ》","d":["近所《きんじょ》の人《ひと》へのあいさつだけ","外壁《がいへき》の色《いろ》を調《しら》べること","建物《たてもの》の写真《しゃしん》を1枚《まい》とるだけ"],"e":"解体《かいたい》・改修《かいしゅう》の工事《こうじ》では、原則《げんそく》として工事《こうじ》の大《おお》きさにかかわらず石綿《いしわた》の事前調査《じぜんちょうさ》が必要《ひつよう》です。建物《たてもの》の調査《ちょうさ》は、決《き》められた資格《しかく》をもつ人《ひと》が行《おこな》います。石綿《いしわた》を吸《す》うと、何十年《なんじゅうねん》もたってから肺《はい》の病気《びょうき》になることがあります。"},
{"id":469,"c":"法規・環境","q":"建設《けんせつ》キャリアアップシステム（CCUS）の目的《もくてき》として、正《ただ》しいものはどれですか。","a":"技能者《ぎのうしゃ》の資格《しかく》や経験《けいけん》を記録《きろく》し、処遇《しょぐう》の改善《かいぜん》につなげる","d":["現場《げんば》の天気《てんき》や気温《きおん》を毎日《まいにち》記録《きろく》する","建設機械《けんせつきかい》の燃料《ねんりょう》の量《りょう》を管理《かんり》する","工事《こうじ》の設計図《せっけいず》を自動《じどう》で作《つく》る"],"e":"技能者《ぎのうしゃ》はカードを持《も》ち、現場《げんば》に入《はい》るときに記録《きろく》します。経験《けいけん》や資格《しかく》によってレベル1〜4に分《わ》けられ、能力《のうりょく》が正《ただ》しく評価《ひょうか》されます。"},
{"id":470,"c":"法規・環境","q":"特定技能《とくていぎのう》2号《ごう》について、正《ただ》しいものはどれですか。","a":"要件《ようけん》を満《み》たせば、家族《かぞく》（配偶者《はいぐうしゃ》と子《こ》）と一緒《いっしょ》に住《す》める","d":["在留期間《ざいりゅうきかん》は通算《つうさん》5年《ねん》までと決《き》まっている","家族《かぞく》を日本《にほん》に呼《よ》ぶことはできない","技能《ぎのう》の試験《しけん》に合格《ごうかく》しなくてもなれる"],"e":"特定技能《とくていぎのう》1号《ごう》は家族《かぞく》を呼《よ》べませんが、2号《ごう》は要件《ようけん》を満《み》たせば配偶者《はいぐうしゃ》と子《こ》を呼《よ》んで一緒《いっしょ》に暮《く》らせます。"},
{"id":471,"c":"法規・環境","q":"特定技能《とくていぎのう》1号《ごう》と2号《ごう》の違《ちが》いとして、正《ただ》しいものはどれですか。","a":"2号《ごう》は在留期間《ざいりゅうきかん》の更新《こうしん》に上限《じょうげん》がない","d":["1号《ごう》は在留期間《ざいりゅうきかん》の更新《こうしん》に上限《じょうげん》がない","2号《ごう》は通算《つうさん》5年《ねん》までしか日本《にほん》にいられない","1号《ごう》は家族《かぞく》を呼《よ》んで一緒《いっしょ》に住《す》める"],"e":"1号《ごう》は通算《つうさん》5年《ねん》までですが、2号《ごう》は更新《こうしん》を続《つづ》ければ上限《じょうげん》なく働《はたら》けます。条件《じょうけん》を満《み》たせば、永住《えいじゅう》の申請《しんせい》につながる可能性《かのうせい》もあります。"},
{"id":472,"c":"法規・環境","q":"建設分野《けんせつぶんや》で特定技能《とくていぎのう》2号《ごう》になるには、試験《しけん》の合格《ごうかく》のほかに、どんな経験《けいけん》が必要《ひつよう》ですか。","a":"班長《はんちょう》として、作業員《さぎょういん》を指導《しどう》した実務経験《じつむけいけん》","d":["設計事務所《せっけいじむしょ》で図面《ずめん》をかいた経験《けいけん》","建設会社《けんせつがいしゃ》で事務《じむ》をした経験《けいけん》","建設機械《けんせつきかい》を販売《はんばい》した経験《けいけん》"],"e":"建設分野《けんせつぶんや》の特定技能《とくていぎのう》2号《ごう》は、2号《ごう》評価試験《ひょうかしけん》（または技能検定《ぎのうけんてい》1級《きゅう》）の合格《ごうかく》と、複数《ふくすう》の作業員《さぎょういん》を指導《しどう》しながら工程《こうてい》を管理《かんり》する班長《はんちょう》としての実務経験《じつむけいけん》が必要《ひつよう》です。"},
{"id":473,"c":"法規・環境","q":"特定技能外国人《とくていぎのうがいこくじん》の給料《きゅうりょう》について、正《ただ》しいものはどれですか。","a":"同《おな》じ仕事《しごと》をする日本人《にほんじん》と同等《どうとう》以上《いじょう》にする","d":["日本人《にほんじん》より低《ひく》くしてよい","最低賃金《さいていちんぎん》より低《ひく》くてもよい","給料《きゅうりょう》は払《はら》わず、食事《しょくじ》だけ出《だ》す"],"e":"外国人《がいこくじん》だという理由《りゆう》で給料《きゅうりょう》を低《ひく》くすることはできません。経験《けいけん》や技能《ぎのう》が上《あ》がったら、給料《きゅうりょう》も上《あ》げていくことが求《もと》められます。"},
{"id":474,"c":"法規・環境","q":"建設業《けんせつぎょう》の会社《かいしゃ》と作業員《さぎょういん》の社会保険《しゃかいほけん》について、正《ただ》しいものはどれですか。","a":"決《き》められた社会保険《しゃかいほけん》に加入《かにゅう》しなければならない","d":["外国人《がいこくじん》は社会保険《しゃかいほけん》に入《はい》れない","入《はい》っても入《はい》らなくても自由《じゆう》である","元請《もとうけ》の社員《しゃいん》だけが入《はい》ればよい"],"e":"健康保険《けんこうほけん》・厚生年金保険《こうせいねんきんほけん》・雇用保険《こようほけん》などに加入《かにゅう》します。今《いま》は社会保険《しゃかいほけん》への加入《かにゅう》が建設業許可《けんせつぎょうきょか》の要件《ようけん》にもなっています。"},
